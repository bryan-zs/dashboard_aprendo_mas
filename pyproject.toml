[project]
name = "prompt-evaluator"
version = "0.1.0"
description = "Construir y evaluar prompts para optimizar el uso de LLMs"
readme = "README.md"
authors = [
    { name = "Bryan Zapata Silupu", email = "bryanzs@mit.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.39.0",
]

[project.scripts]
prompt-evaluator = "prompt_evaluator:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
